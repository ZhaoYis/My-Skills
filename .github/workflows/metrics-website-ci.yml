name: Metrics Website CI

on:
  push:
    paths:
      - 'dev-pipeline/metrics-website/**'
      - 'dev-pipeline/metrics-server/docs/openapi.json'
      - '.github/workflows/metrics-website-ci.yml'
  pull_request:
    paths:
      - 'dev-pipeline/metrics-website/**'
      - 'dev-pipeline/metrics-server/docs/openapi.json'
      - '.github/workflows/metrics-website-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dev-pipeline/metrics-website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: ci-auth-credential-at-least-32-characters
      AUTH_TRUST_HOST: 'true'
      OIDC_ISSUER: https://sso.ci.internal
      OIDC_CLIENT_ID: metrics-ci-client
      OIDC_CLIENT_SECRET: ci-oidc-credential
      METRICS_API_URL: https://metrics-api.ci.internal/api/v1
      METRICS_API_KEY: ci.ci-service-exchange-credential

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-pipeline/metrics-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright / desktop and mobile Chromium
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dev-pipeline/metrics-website
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-pipeline/metrics-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-website-playwright-${{ github.run_attempt }}
          path: |
            dev-pipeline/metrics-website/playwright-report/
            dev-pipeline/metrics-website/test-results/
          if-no-files-found: ignore
          retention-days: 7
