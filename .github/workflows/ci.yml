name: CI

on:
  push:
    paths:
      - 'dev-pipeline/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'dev-pipeline/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dev-pipeline

env:
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: biome lint
        run: npm run lint

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck

  test-hooks:
    name: Unit tests (hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: vitest run --dir test/unit/hooks
        run: npm run test:hooks

  test:
    name: Test suite (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: vitest run --dir test (unit + integration + pipeline)
        run: npm test
      - name: Init CLI smoke (--dry-run, no openspec required)
        run: npm run init:smoke

  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: tsc --build
        run: npm run build
      - name: Inspect npm pack contents
        run: npm run pack:check