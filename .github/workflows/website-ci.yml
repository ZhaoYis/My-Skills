name: Website CI

on:
  push:
    paths:
      - 'dev-pipeline/website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'dev-pipeline/website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev-pipeline/website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev-pipeline/website/package-lock.json

      - name: Show resolved working directory
        run: pwd && ls package.json package-lock.json && node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
