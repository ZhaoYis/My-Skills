name: Website CI

on:
  push:
    paths:
      - 'dev-pipeline/website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'dev-pipeline/website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev-pipeline/website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 5

      - name: Lint
        run: npm run lint
        timeout-minutes: 5

      - name: Build
        run: npm run build
        timeout-minutes: 10
