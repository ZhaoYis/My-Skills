        // ─── State ──────────────────────────────────
        let snake = [];
        let food = null;
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let bestScore = 0;
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let speed = BASE_SPEED;
        let particles = [];
        let growAmount = 0;  // pending growth segments
        let lastRenderTime = 0;

        // ─── Timed Mode State ──────────────────────
        let gameMode = 'classic';          // 'classic' | 'timed'
        let timeRemaining = INITIAL_TIME;  // seconds
        let timerAccumulator = 0;          // ms accumulator for 1s ticks
        let foodItem = null;               // current food item type (from ITEM_TYPES)
        let shieldActive = false;          // shield power-up
        let boostActive = false;           // lightning speed boost
        let boostEndTime = 0;              // performance.now() when boost expires

        // ─── Bomb State ──────────────────────────────
        let bombs = [];              // { x, y, type, spawnTime, fuseDuration }
        let explosions = [];         // { x, y, startTime, chainLevel }
        let bombSpawnAccumulator = 0;
        let nextBombSpawnDelay = BOMB_CONFIG.spawnIntervalMin
            + Math.random() * (BOMB_CONFIG.spawnIntervalMax - BOMB_CONFIG.spawnIntervalMin);

        // ─── Canvas Setup ──────────────────────────
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const canvasWidth = COLS * CELL_SIZE;
        const canvasHeight = ROWS * CELL_SIZE;

        canvas.width = canvasWidth * dpr;
        canvas.height = canvasHeight * dpr;
        canvas.style.width = canvasWidth + 'px';
        canvas.style.height = canvasHeight + 'px';
        ctx.scale(dpr, dpr);

        // ─── Load Best Scores ───────────────────────
        let bestScoreClassic = 0;
        let bestScoreTimed = 0;
        try {
            // Migrate old key if present
            const oldBest = localStorage.getItem('snake-best-score');
            if (oldBest) {
                bestScoreClassic = parseInt(oldBest, 10) || 0;
                localStorage.removeItem('snake-best-score');
                localStorage.setItem('snake-best-score-classic', bestScoreClassic);
            } else {
                const savedClassic = localStorage.getItem('snake-best-score-classic');
                if (savedClassic) bestScoreClassic = parseInt(savedClassic, 10) || 0;
            }
            const savedTimed = localStorage.getItem('snake-best-score-timed');
            if (savedTimed) bestScoreTimed = parseInt(savedTimed, 10) || 0;
        } catch (e) { /* localStorage not available */ }

        function updateBestDisplay() {
            bestScore = gameMode === 'classic' ? bestScoreClassic : bestScoreTimed;
            bestScoreEl.textContent = bestScore;
            classicBestEl.textContent = bestScoreClassic;
            timedBestEl.textContent = bestScoreTimed;
        }
        updateBestDisplay();

        // ─── Mode Selection ─────────────────────────
        function selectMode(mode) {
            if (isRunning) return; // only switch before game starts
            gameMode = mode;
            modeCardClassic.classList.toggle('selected', mode === 'classic');
            modeCardTimed.classList.toggle('selected', mode === 'timed');
            modeCardClassic.setAttribute('aria-checked', mode === 'classic');
            modeCardTimed.setAttribute('aria-checked', mode === 'timed');

            // Show/hide timer card
            timerCard.classList.toggle('timer-hidden', mode !== 'timed');

            // Update best score display for selected mode
            updateBestDisplay();

            // Persist mode preference
            try { localStorage.setItem('snake-game-mode', mode); } catch (e) {}

            // Redraw canvas if showing initial state
            if (!isRunning) draw();
        }

        // Load saved mode or default
        try {
            const savedMode = localStorage.getItem('snake-game-mode');
            if (savedMode === 'classic' || savedMode === 'timed') {
                selectMode(savedMode);
            }
        } catch (e) {}

        // ─── Skin System ───────────────────────────
        function applySkin(id) {
            const skin = SKINS[id] || SKINS.classic;
            currentSkin = skin;

            // Apply CSS variables to :root
            Object.entries(skin.css).forEach(([k, v]) => {
                document.documentElement.style.setProperty(k, v);
            });

            // Apply ambient background glow
            document.body.style.backgroundImage = `
                radial-gradient(ellipse at 50% 0%, ${skin.ambientGlow1} 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, ${skin.ambientGlow2} 0%, transparent 60%)
            `;

            // Update swatch active states
            document.querySelectorAll('.skin-swatch').forEach(btn => {
                const isActive = btn.dataset.skin === id;
                btn.classList.toggle('active', isActive);
            });

            // Persist
            try { localStorage.setItem('snake-skin', id); } catch (e) {}

            // Re-render if game isn't running
            if (!isRunning) draw();
        }

        function cycleSkin() {
            const currentIdx = SKIN_KEYS.indexOf(currentSkin?.id);
            const nextIdx = (currentIdx + 1) % SKIN_KEYS.length;
            applySkin(SKIN_KEYS[nextIdx]);
        }

        // Load saved skin or default
        let savedSkin = 'classic';
        try {
            const stored = localStorage.getItem('snake-skin');
            if (stored && SKINS[stored]) savedSkin = stored;
        } catch (e) {}
        applySkin(savedSkin);

        // ─── Helpers ───────────────────────────────
        function randomCell() {
            return {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS),
            };
        }

        function cellEquals(a, b) {
            return a.x === b.x && a.y === b.y;
        }

        function snakeOccupies(cell) {
            return snake.some(s => cellEquals(s, cell));
        }

        function spawnParticles(cell) {
            const cx = cell.x * CELL_SIZE + CELL_SIZE / 2;
            const cy = cell.y * CELL_SIZE + CELL_SIZE / 2;
            const cs = currentSkin.canvas;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.3;
                const dist = 3 + Math.random() * 6;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * dist,
                    vy: Math.sin(angle) * dist,
                    life: 1,
                    decay: 0.03 + Math.random() * 0.04,
                    size: 2 + Math.random() * 3,
                    color: `hsl(${cs.particleHue + Math.random() * cs.particleHueRange}, 90%, ${55 + Math.random() * 25}%)`,
                });
            }
        }

        // ─── Bomb Logic ────────────────────────────
        function getCellsInRadius(x, y, radius) {
            const cells = [];
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dy = -radius; dy <= radius; dy++) {
                    const cx = x + dx;
                    const cy = y + dy;
                    if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
                        cells.push({ x: cx, y: cy });
                    }
                }
            }
            return cells;
        }

        function cellIsOccupiedByBomb(cell) {
            return bombs.some(b => b.x === cell.x && b.y === cell.y);
        }

        function bombAt(cell) {
            return bombs.find(b => b.x === cell.x && b.y === cell.y);
        }

        function spawnBomb() {
            if (bombs.length >= BOMB_CONFIG.maxBombs) return;

            // Find a random empty cell (not snake, not food, not bomb)
            let pos = null;
            for (let attempt = 0; attempt < 200; attempt++) {
                const candidate = randomCell();
                if (!snakeOccupies(candidate)
                    && !(food && cellEquals(food, candidate))
                    && !cellIsOccupiedByBomb(candidate)) {
                    pos = candidate;
                    break;
                }
            }
            if (!pos) return; // no room

            const type = Math.random() < BOMB_CONFIG.dormantProb
                ? BOMB_TYPES.DORMANT
                : BOMB_TYPES.UNSTABLE;

            const bomb = {
                x: pos.x,
                y: pos.y,
                type: type,
                spawnTime: performance.now(),
                fuseDuration: type === BOMB_TYPES.UNSTABLE
                    ? BOMB_CONFIG.unstableFuseMin
                        + Math.random() * (BOMB_CONFIG.unstableFuseMax - BOMB_CONFIG.unstableFuseMin)
                    : Infinity,
            };
            bombs.push(bomb);
        }

        function triggerExplosion(bomb, chainLevel) {
            // Remove the triggering bomb
            const bombIdx = bombs.indexOf(bomb);
            if (bombIdx !== -1) bombs.splice(bombIdx, 1);

            const cells = getCellsInRadius(bomb.x, bomb.y, EXPLOSION_RADIUS);

            // Check snake head first
            const head = snake[0];
            const headInBlast = cells.some(c => cellEquals(c, head));

            if (headInBlast) {
                if (shieldActive) {
                    // Shield saves from death, direction reverses
                    shieldActive = false;
                    shieldIndicator.classList.remove('active');
                    direction = { x: -direction.x, y: -direction.y };
                    nextDirection = { ...direction };
                    // Flash screen
                    canvasWrapper.classList.remove('flash');
                    void canvasWrapper.offsetWidth;
                    canvasWrapper.classList.add('flash');
                } else {
                    // Death by explosion
                    gameOver(false, 'bomb');
                    return;
                }
            }

            // Check snake body (find closest-to-head segment in blast)
            let minBodyIdx = Infinity;
            for (const cell of cells) {
                for (let i = 1; i < snake.length; i++) {
                    if (cellEquals(cell, snake[i]) && i < minBodyIdx) {
                        minBodyIdx = i;
                    }
                }
            }

            if (minBodyIdx < Infinity) {
                // Sever body at that point
                const severed = snake.length - minBodyIdx;
                snake = snake.slice(0, minBodyIdx);
                // Score for severed segments with chain multiplier
                score += severed * BOMB_CONFIG.chainBaseScore * chainLevel;
                currentScoreEl.textContent = score;
            }

            // Destroy food if in blast
            if (food && cells.some(c => cellEquals(c, food))) {
                foodItem = null;
                food = spawnFood();
            }

            // Chain reaction — check other bombs in blast
            const otherBombs = bombs.filter(b =>
                b !== bomb && cells.some(c => c.x === b.x && c.y === b.y)
            );
            for (const other of otherBombs) {
                // Guard: bomb may have been removed by a prior recursive call
                if (!bombs.includes(other)) continue;
                triggerExplosion(other, chainLevel + 1);
            }

            // 播放爆炸音效
            AudioManager.playExplosion(chainLevel);

            // Record explosion animation
            explosions.push({
                x: bomb.x,
                y: bomb.y,
                startTime: performance.now(),
                chainLevel: chainLevel,
            });
        }

        // ─── Game Logic ────────────────────────────
        function rollItemType() {
            // Special items now spawn in both classic and timed modes
            const roll = Math.random();
            let cumulative = 0;
            for (const entry of ITEM_PROBABILITIES) {
                cumulative += entry.prob;
                if (roll < cumulative) return entry.type;
            }
            return ITEM_TYPES.NORMAL;
        }

        function spawnFood() {
            let pos;
            function isEmpty(cell) {
                return !snakeOccupies(cell) && !cellIsOccupiedByBomb(cell);
            }
            // Try a limited number of times to find an empty cell
            for (let i = 0; i < 1000; i++) {
                pos = randomCell();
                if (isEmpty(pos)) {
                    foodItem = rollItemType();
                    return pos;
                }
            }
            // If the board is nearly full, scan all cells
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (isEmpty({ x, y })) {
                        foodItem = rollItemType();
                        return { x, y };
                    }
                }
            }
            return null; // board full — you win!
        }

        function initGame() {
            // Snake starts in the middle, going right
            const startX = Math.floor(COLS / 2);
            const startY = Math.floor(ROWS / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = BASE_SPEED;
            growAmount = 0;
            particles = [];
            food = spawnFood();
            currentScoreEl.textContent = '0';

            // Timed mode init
            if (gameMode === 'timed') {
                timeRemaining = INITIAL_TIME;
                timerAccumulator = 0;
                shieldActive = false;
                boostActive = false;
                boostEndTime = 0;
                timerValueEl.textContent = timeRemaining + 's';
                timerValueEl.classList.remove('warning', 'danger');
                timerValueEl.classList.add('timer');
                timerCard.classList.remove('timer-hidden');
                shieldIndicator.classList.remove('active');
            } else {
                timerCard.classList.add('timer-hidden');
                // Classic mode: items possible, but no shield/boost carryover
                shieldActive = false;
                boostActive = false;
                boostEndTime = 0;
                shieldIndicator.classList.remove('active');
            }

            // Reset bomb state for both modes
            bombs = [];
            explosions = [];
            bombSpawnAccumulator = 0;
            nextBombSpawnDelay = BOMB_CONFIG.spawnIntervalMin
                + Math.random() * (BOMB_CONFIG.spawnIntervalMax - BOMB_CONFIG.spawnIntervalMin);

            updateBestDisplay();
            foodItem = rollItemType();
        }

        function handleCollision() {
            // Shield protection: reverse direction instead of dying
            if (shieldActive) {
                shieldActive = false;
                shieldIndicator.classList.remove('active');
                // Reverse direction
                direction = { x: -direction.x, y: -direction.y };
                nextDirection = { ...direction };
                // Flash screen feedback
                canvasWrapper.classList.remove('flash');
                void canvasWrapper.offsetWidth; // reflow
                canvasWrapper.classList.add('flash');
                return false; // not dead
            }
            return true; // dead
        }

        function update() {
            // Apply the queued direction
            direction = { ...nextDirection };

            // Calculate new head
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y,
            };

            // Wall collision
            if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
                if (!handleCollision()) return;
                return gameOver();
            }

            // Self collision (check against current body except the tail, which will move away)
            // But if we're growing, the tail doesn't move, so check full body
            const bodyToCheck = growAmount > 0 ? snake : snake.slice(0, -1);
            if (bodyToCheck.some(s => cellEquals(s, newHead))) {
                if (!handleCollision()) return;
                return gameOver();
            }

            // Add new head
            snake.unshift(newHead);

            // Check bomb collision
            const hitBomb = bombAt(newHead);
            if (hitBomb) {
                if (hitBomb.type === BOMB_TYPES.DORMANT) {
                    // Touch dormant: lose 2-3 segments, bomb disappears
                    const loss = BOMB_CONFIG.dormantSegmentLossMin
                        + Math.floor(Math.random()
                            * (BOMB_CONFIG.dormantSegmentLossMax - BOMB_CONFIG.dormantSegmentLossMin + 1));
                    if (snake.length <= loss) {
                        return gameOver(false, 'bomb');
                    }
                    snake = snake.slice(0, snake.length - loss);
                    bombs.splice(bombs.indexOf(hitBomb), 1);
                } else {
                    // Touch unstable: immediate explosion
                    triggerExplosion(hitBomb, 1);
                    if (!isRunning) return; // died in explosion
                }
            }

            // Check food collision
            if (food && cellEquals(newHead, food)) {
                const itemType = foodItem || ITEM_TYPES.NORMAL;
                const effect = ITEM_EFFECTS[itemType];

                score += effect.score;
                growAmount += 1;
                speed = Math.max(45, BASE_SPEED - Math.floor(score / 100) * 8);
                spawnParticles(food);
                currentScoreEl.textContent = score;

                // Timed mode: add time
                if (gameMode === 'timed') {
                    timeRemaining = Math.min(MAX_TIME, timeRemaining + effect.time);
                    timerValueEl.textContent = timeRemaining + 's';
                }

                // Lightning effect
                if (itemType === ITEM_TYPES.LIGHTNING) {
                    boostActive = true;
                    boostEndTime = performance.now() + BOOST_DURATION;
                }

                // Shield effect
                if (itemType === ITEM_TYPES.SHIELD) {
                    shieldActive = true;
                    shieldIndicator.classList.add('active');
                }

                food = spawnFood();
                if (!food) return gameOver(true); // win
            }

            // Remove tail segments (or keep them if growing)
            if (growAmount > 0) {
                growAmount--;
            } else {
                snake.pop();
            }
        }

        function gameOver(won = false, reason = 'collision') {
            stopGameLoop();
            isRunning = false;

            const titleEl = document.querySelector('#gameOverOverlay .overlay-title');

            if (won) {
                // You filled the board!
                finalScoreEl.textContent = score;
                titleEl.textContent = '🎉 恭喜通关!';
                titleEl.classList.remove('game-over');
                titleEl.style.color = '#22d3ee';
            } else if (reason === 'timeUp') {
                titleEl.textContent = '⏰ 时间到!';
                titleEl.classList.remove('game-over');
                titleEl.style.color = '#fbbf24';
                finalScoreEl.textContent = score;
            } else if (reason === 'bomb') {
                titleEl.textContent = '💥 被炸死了!';
                titleEl.classList.add('game-over');
                titleEl.style.color = '';
                finalScoreEl.textContent = score;
            } else {
                titleEl.textContent = '游戏结束';
                titleEl.classList.add('game-over');
                titleEl.style.color = '';
                finalScoreEl.textContent = score;
            }

            // Update best score — separate storage per mode
            if (gameMode === 'classic') {
                if (score > bestScoreClassic) {
                    bestScoreClassic = score;
                    try { localStorage.setItem('snake-best-score-classic', bestScoreClassic); } catch (e) {}
                }
            } else {
                if (score > bestScoreTimed) {
                    bestScoreTimed = score;
                    try { localStorage.setItem('snake-best-score-timed', bestScoreTimed); } catch (e) {}
                }
            }
            updateBestDisplay();

            // 保存到排行榜
            var rank = -1;
            var entryId = null;
            if (score > 0) {
                rank = LeaderboardStore.addEntry({
                    score: score,
                    mode: gameMode,
                    snakeLength: snake.length,
                    result: won ? 'win' : reason,
                    skin: currentSkin ? currentSkin.id : 'classic',
                });
                if (rank > 0) {
                    // 找到刚插入的记录 ID（排行榜中分数+日期匹配的第一条）
                    var all = LeaderboardStore.getAll();
                    for (var i = 0; i < all.length; i++) {
                        if (all[i].score === score && all[i].mode === gameMode) {
                            entryId = all[i].id;
                            break;
                        }
                    }
                }
            }

            // 显示排名信息
            if (rank > 0) {
                rankPosition.textContent = rank;
                rankInfo.style.display = '';
            } else {
                rankInfo.style.display = 'none';
            }

            // 存储刚插入记录的 ID 供排行榜高亮使用
            window._lastGameEntryId = entryId;

            gameOverOverlay.classList.add('active');

            // 刷新开始界面摘要
            renderLeaderboardSummary();
        }

        function stopGameLoop() {
            if (gameLoop) {
                cancelAnimationFrame(gameLoop);
                gameLoop = null;
            }
        }

        function startGameLoop() {
            stopGameLoop();
            let accumulator = 0;
            let lastTick = performance.now();

            function tick(now) {
                if (!isRunning) return;

                gameLoop = requestAnimationFrame(tick);

                if (isPaused) {
                    lastTick = now;
                    accumulator = 0;
                    timerAccumulator = 0;
                    draw();
                    return;
                }

                const dt = now - lastTick;
                lastTick = now;
                accumulator += dt;

                // ── Timed mode: second-based countdown ──
                if (gameMode === 'timed') {
                    timerAccumulator += dt;
                    while (timerAccumulator >= 1000) {
                        timerAccumulator -= 1000;
                        timeRemaining--;
                        timerValueEl.textContent = timeRemaining + 's';

                        // Update timer color classes
                        timerValueEl.classList.remove('warning', 'danger');
                        if (timeRemaining <= 10) {
                            timerValueEl.classList.add('danger');
                        } else if (timeRemaining <= 30) {
                            timerValueEl.classList.add('warning');
                        }

                        if (timeRemaining <= 0) {
                            gameOver(false, 'timeUp');
                            return;
                        }
                    }
                }

                // ── Bomb spawn timer ──
                bombSpawnAccumulator += dt;
                while (bombSpawnAccumulator >= nextBombSpawnDelay) {
                    bombSpawnAccumulator -= nextBombSpawnDelay;
                    spawnBomb();
                    nextBombSpawnDelay = BOMB_CONFIG.spawnIntervalMin
                        + Math.random() * (BOMB_CONFIG.spawnIntervalMax - BOMB_CONFIG.spawnIntervalMin);
                }

                // ── Unstable bomb fuse check ──
                for (let i = bombs.length - 1; i >= 0; i--) {
                    const b = bombs[i];
                    if (b.type === BOMB_TYPES.UNSTABLE && now - b.spawnTime >= b.fuseDuration) {
                        triggerExplosion(b, 1);
                        if (!isRunning) return; // died in explosion
                    }
                }

                // ── Lightning boost check ──
                if (boostActive && now >= boostEndTime) {
                    boostActive = false;
                }

                // ── Effective speed (with boost) ──
                const effectiveSpeed = boostActive ? speed * 2 : speed;

                let updated = false;
                while (accumulator >= effectiveSpeed) {
                    accumulator -= effectiveSpeed;
                    update();
                    updated = true;
                    if (!isRunning) return; // game over during update
                }

                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.92;
                    p.vy *= 0.92;
                    p.life -= p.decay;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                draw();
            }

            gameLoop = requestAnimationFrame(tick);
        }

        // ─── Bomb Drawing ────────────────────────────
        function drawBombs() {
            const cs = currentSkin.canvas;
            const now = performance.now();

            for (const bomb of bombs) {
                const bx = bomb.x * CELL_SIZE + CELL_SIZE / 2;
                const by = bomb.y * CELL_SIZE + CELL_SIZE / 2;
                const r = CELL_SIZE / 2 - 2;

                if (bomb.type === BOMB_TYPES.DORMANT) {
                    // Slow breathing pulse
                    const pulse = 1 + 0.08 * Math.sin(now / 1000);
                    const glowR = r * 1.5 * pulse;

                    // Outer glow
                    const glow = ctx.createRadialGradient(bx, by, r * 0.3, bx, by, glowR);
                    glow.addColorStop(0, cs.bombDormantGlow);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(bx, by, glowR, 0, Math.PI * 2);
                    ctx.fill();

                    // Body
                    const grad = ctx.createRadialGradient(bx - 1, by - 1, 0, bx, by, r);
                    grad.addColorStop(0, cs.bombDormantHighlight || '#e88');
                    grad.addColorStop(0.4, cs.bombDormantBody);
                    grad.addColorStop(1, cs.bombDormantDark || '#622');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(bx, by, r * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    // Metallic highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.arc(bx - r * 0.25, by - r * 0.25, r * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // Unstable — erratic pulse
                    const jitter = 1 + 0.12 * Math.sin(now / 200)
                        + 0.08 * Math.sin(now / 317)
                        + 0.05 * Math.sin(now / 523);
                    const glowR = r * 1.6 * jitter;

                    // Outer glow
                    const glow = ctx.createRadialGradient(bx, by, r * 0.2, bx, by, glowR);
                    glow.addColorStop(0, cs.bombUnstableGlow);
                    glow.addColorStop(0.4, cs.bombUnstableGlowMid || 'rgba(255,140,0,0.25)');
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(bx, by, glowR, 0, Math.PI * 2);
                    ctx.fill();

                    // Body
                    const grad = ctx.createRadialGradient(bx - 1, by - 1, 0, bx, by, r);
                    grad.addColorStop(0, cs.bombUnstableHighlight || '#ffc');
                    grad.addColorStop(0.35, cs.bombUnstableBody);
                    grad.addColorStop(1, cs.bombUnstableDark || '#830');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(bx, by, r * jitter, 0, Math.PI * 2);
                    ctx.fill();

                    // Spark particles (intermittent)
                    if (Math.random() > 0.3) {
                        const sparkCount = 2 + Math.floor(Math.random() * 3);
                        for (let s = 0; s < sparkCount; s++) {
                            const angle = Math.random() * Math.PI * 2;
                            const dist = r * 1.1 + Math.random() * r * 0.8;
                            const sx = bx + Math.cos(angle) * dist;
                            const sy = by + Math.sin(angle) * dist;
                            ctx.fillStyle = cs.bombUnstableSpark;
                            ctx.beginPath();
                            ctx.arc(sx, sy, 1 + Math.random() * 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
        }

        function drawExplosions() {
            const cs = currentSkin.canvas;
            const now = performance.now();

            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                const elapsed = now - exp.startTime;
                const duration = BOMB_CONFIG.explosionDuration;

                if (elapsed >= duration) {
                    explosions.splice(i, 1);
                    continue;
                }

                const progress = elapsed / duration;
                const cx = exp.x * CELL_SIZE + CELL_SIZE / 2;
                const cy = exp.y * CELL_SIZE + CELL_SIZE / 2;

                if (progress < 0.125) {
                    // Phase 1: Flash (0-50ms) — white bloom at center
                    const flashAlpha = 1 - progress / 0.125;
                    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
                    const flashR = CELL_SIZE * 0.8;
                    ctx.beginPath();
                    ctx.arc(cx, cy, flashR, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Phase 2: Blast wave (50-500ms)
                const blastProgress = Math.max(0, progress - 0.05);
                const blastRadius = CELL_SIZE * 2 * Math.min(1, blastProgress * 2.5);
                const blastAlpha = Math.max(0, 0.7 - blastProgress * 1.4);

                // Build blast gradient with current alpha
                const blast = ctx.createRadialGradient(cx, cy, blastRadius * 0.2, cx, cy, blastRadius);
                const blastColor = cs.explosionBlast.replace(/[\d.]+\)$/, blastAlpha.toFixed(2) + ')');
                blast.addColorStop(0, blastColor);
                blast.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = blast;
                ctx.fillRect(cx - blastRadius, cy - blastRadius, blastRadius * 2, blastRadius * 2);

                // Phase 3: Fire grid (3×3 cells get fire overlay)
                const cells = getCellsInRadius(exp.x, exp.y, EXPLOSION_RADIUS);
                const fireAlpha = Math.max(0, 0.45 - progress * 0.9);
                const groundColor = cs.explosionGround.replace(/[\d.]+\)$/, fireAlpha.toFixed(2) + ')');
                for (const cell of cells) {
                    ctx.fillStyle = groundColor;
                    ctx.fillRect(cell.x * CELL_SIZE, cell.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }

                // Chain multiplier text
                if (exp.chainLevel >= 2) {
                    const textAlpha = Math.max(0, 1 - progress * 2.5);
                    const textY = exp.y * CELL_SIZE - 10 - progress * 30;
                    ctx.fillStyle = `rgba(255, 200, 50, ${textAlpha})`;
                    ctx.font = 'bold 14px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`×${exp.chainLevel}`, cx, textY);
                    ctx.textAlign = 'start';
                }

                // Explosion particles
                const seed = exp.x * 1000 + exp.y; // deterministic seed per explosion
                const particleCount = 12;
                for (let p = 0; p < particleCount; p++) {
                    const pAngle = (Math.PI * 2 * p) / particleCount + seed * 0.01;
                    const pDist = CELL_SIZE * 0.5 + progress * CELL_SIZE * 2.5;
                    const px = cx + Math.cos(pAngle) * pDist;
                    const py = cy + Math.sin(pAngle) * pDist;
                    const pAlpha = Math.max(0, 0.7 - progress * 1.5);
                    // Deterministic size from seed — avoids flicker across frames
                    const pSize = (2 + ((seed + p) % 3)) * (1 - progress);
                    const partColor = cs.explosionParticle.replace(/[\d.]+\)$/, pAlpha.toFixed(2) + ')');
                    ctx.fillStyle = partColor;
                    ctx.beginPath();
                    ctx.arc(px, py, pSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ─── Drawing ────────────────────────────────
        function draw() {
            const w = canvasWidth;
            const h = canvasHeight;

            const cs = currentSkin.canvas;

            // Clear
            ctx.fillStyle = cs.boardBg;
            ctx.fillRect(0, 0, w, h);

            // Grid lines (subtle)
            ctx.strokeStyle = cs.gridColor;
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL_SIZE, 0);
                ctx.lineTo(x * CELL_SIZE, h);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL_SIZE);
                ctx.lineTo(w, y * CELL_SIZE);
                ctx.stroke();
            }

            // Food — pulsating glow (varies by item type)
            if (food) {
                const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
                const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
                const pulse = 1 + 0.2 * Math.sin(performance.now() / 200);
                const r = (CELL_SIZE / 2 - 2) * pulse;

                const itemType = foodItem || ITEM_TYPES.NORMAL;

                if (itemType === ITEM_TYPES.GOLDEN) {
                    // ── Golden Apple ──
                    // Outer glow (golden)
                    const glowG = ctx.createRadialGradient(fx, fy, r * 0.3, fx, fy, r * 2.2);
                    glowG.addColorStop(0, 'rgba(251, 191, 36, 0.7)');
                    glowG.addColorStop(0.4, 'rgba(251, 191, 36, 0.2)');
                    glowG.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glowG;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Rotating sparkle particles
                    const sparkCount = 6;
                    const sparkAngle = performance.now() / 600;
                    for (let s = 0; s < sparkCount; s++) {
                        const sa = sparkAngle + (Math.PI * 2 * s) / sparkCount;
                        const sx = fx + Math.cos(sa) * (r * 1.6);
                        const sy = fy + Math.sin(sa) * (r * 1.6);
                        ctx.fillStyle = 'rgba(255, 255, 200, 0.9)';
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Body — golden gradient
                    const gGrad = ctx.createRadialGradient(fx - 1, fy - 1, 0, fx, fy, r);
                    gGrad.addColorStop(0, '#fef3c7');
                    gGrad.addColorStop(0.3, '#fbbf24');
                    gGrad.addColorStop(1, '#b45309');
                    ctx.fillStyle = gGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Star shape on top
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(fx - r * 0.2, fy - r * 0.25, r * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (itemType === ITEM_TYPES.LIGHTNING) {
                    // ── Lightning ──
                    // Electric glow
                    const eGlow = ctx.createRadialGradient(fx, fy, r * 0.2, fx, fy, r * 2);
                    eGlow.addColorStop(0, 'rgba(34, 211, 238, 0.8)');
                    eGlow.addColorStop(0.3, 'rgba(34, 211, 238, 0.25)');
                    eGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = eGlow;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Electric arcs (flickering)
                    const flicker = Math.random() > 0.4;
                    if (flicker) {
                        ctx.strokeStyle = 'rgba(167, 243, 255, 0.9)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        for (let j = 0; j < 3; j++) {
                            const arcAngle = (Math.PI * 2 * j) / 3 + performance.now() / 1500;
                            const sx2 = fx + Math.cos(arcAngle) * r * 0.6;
                            const sy2 = fy + Math.sin(arcAngle) * r * 0.6;
                            const ex2 = fx + Math.cos(arcAngle) * r * 1.5;
                            const ey2 = fy + Math.sin(arcAngle) * r * 1.5;
                            const midX = (sx2 + ex2) / 2 + (Math.random() - 0.5) * 6;
                            const midY = (sy2 + ey2) / 2 + (Math.random() - 0.5) * 6;
                            ctx.moveTo(sx2, sy2);
                            ctx.quadraticCurveTo(midX, midY, ex2, ey2);
                        }
                        ctx.stroke();
                    }

                    // Body — cyan electric
                    const eGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, r);
                    eGrad.addColorStop(0, '#e0f2fe');
                    eGrad.addColorStop(0.3, '#22d3ee');
                    eGrad.addColorStop(1, '#0e7490');
                    ctx.fillStyle = eGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 0.85, 0, Math.PI * 2);
                    ctx.fill();

                    // ⚡ icon hint
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', fx, fy);
                    ctx.textAlign = 'start';

                } else if (itemType === ITEM_TYPES.SHIELD) {
                    // ── Shield Orb ──
                    // Purple outer ring (pulsing)
                    const ringPulse = 1 + 0.15 * Math.sin(performance.now() / 300);
                    ctx.strokeStyle = `rgba(192, 132, 252, ${0.5 + 0.3 * Math.sin(performance.now() / 250)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * ringPulse * 1.5, 0, Math.PI * 2);
                    ctx.stroke();

                    // Ring 2
                    ctx.strokeStyle = `rgba(192, 132, 252, ${0.3 + 0.2 * Math.sin(performance.now() / 350)})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * ringPulse * 1.9, 0, Math.PI * 2);
                    ctx.stroke();

                    // Outer glow
                    const pGlow = ctx.createRadialGradient(fx, fy, r * 0.3, fx, fy, r * 2);
                    pGlow.addColorStop(0, 'rgba(192, 132, 252, 0.6)');
                    pGlow.addColorStop(0.5, 'rgba(192, 132, 252, 0.15)');
                    pGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = pGlow;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Body — purple
                    const pGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, r);
                    pGrad.addColorStop(0, '#e9d5ff');
                    pGrad.addColorStop(0.35, '#a855f7');
                    pGrad.addColorStop(1, '#6b21a8');
                    ctx.fillStyle = pGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 0.9, 0, Math.PI * 2);
                    ctx.fill();

                    // 🛡️ icon hint
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🛡️', fx, fy);
                    ctx.textAlign = 'start';

                } else {
                    // ── Normal food (classic red apple) ──
                    // Outer glow
                    const glow = ctx.createRadialGradient(fx, fy, r * 0.3, fx, fy, r * 1.8);
                    glow.addColorStop(0, cs.foodGlow);
                    glow.addColorStop(0.5, cs.foodGlowMid);
                    glow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r * 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    // Food body
                    const foodGrad = ctx.createRadialGradient(fx - 1, fy - 1, 0, fx, fy, r);
                    foodGrad.addColorStop(0, cs.foodGradHigh);
                    foodGrad.addColorStop(0.4, cs.foodGradMid);
                    foodGrad.addColorStop(1, cs.foodGradDark);
                    ctx.fillStyle = foodGrad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Highlight
                    ctx.fillStyle = cs.foodHighlight;
                    ctx.beginPath();
                    ctx.arc(fx - r * 0.25, fy - r * 0.25, r * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Bombs (behind snake — snake walks over them when touching)
            drawBombs();

            // Explosions (above everything)
            drawExplosions();

            // Snake
            const totalLen = snake.length;
            for (let i = snake.length - 1; i >= 0; i--) {
                const seg = snake[i];
                const sx = seg.x * CELL_SIZE;
                const sy = seg.y * CELL_SIZE;
                const pad = 1.5;
                const segSize = CELL_SIZE - pad * 2;

                // Color gradient from head to tail
                let color;
                if (i === 0) {
                    color = cs.snakeHead;
                } else {
                    const t = i / Math.max(totalLen - 1, 1);
                    const r = Math.round(cs.snakeBodyStart.r + t * (cs.snakeBodyEnd.r - cs.snakeBodyStart.r));
                    const g = Math.round(cs.snakeBodyStart.g + t * (cs.snakeBodyEnd.g - cs.snakeBodyStart.g));
                    const b = Math.round(cs.snakeBodyStart.b + t * (cs.snakeBodyEnd.b - cs.snakeBodyStart.b));
                    color = `rgb(${r}, ${g}, ${b})`;
                }

                const rx = sx + pad;
                const ry = sy + pad;
                const r = i === 0 ? 5 : 4;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(rx, ry, segSize, segSize, r);
                ctx.fill();

                // Highlight on top
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.beginPath();
                ctx.roundRect(rx + 2, ry + 1, segSize - 4, segSize / 3, 2);
                ctx.fill();

                // Head effects (shield / boost)
                if (i === 0) {
                    const hx = sx + CELL_SIZE / 2;
                    const hy = sy + CELL_SIZE / 2;

                    // Shield glow on head
                    if (shieldActive) {
                        const shGlow = ctx.createRadialGradient(hx, hy, segSize * 0.5, hx, hy, segSize * 1.4);
                        shGlow.addColorStop(0, 'rgba(192, 132, 252, 0.5)');
                        shGlow.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = shGlow;
                        ctx.beginPath();
                        ctx.arc(hx, hy, segSize * 1.4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Boost outline (blue glow)
                    if (boostActive) {
                        ctx.strokeStyle = `rgba(34, 211, 238, ${0.4 + 0.3 * Math.sin(performance.now() / 100)})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.roundRect(rx - 1, ry - 1, segSize + 2, segSize + 2, 6);
                        ctx.stroke();
                    }

                    // Head eyes
                    const eyeR = 2.5;
                    let eyeOffX = 0, eyeOffY = 0;
                    if (direction.x === 1)  { eyeOffX = 2; eyeOffY = 0; }
                    if (direction.x === -1) { eyeOffX = -2; eyeOffY = 0; }
                    if (direction.y === 1)  { eyeOffX = 0; eyeOffY = 2; }
                    if (direction.y === -1) { eyeOffX = 0; eyeOffY = -2; }

                    const eye1X = hx + eyeOffX - 4 + (eyeOffY !== 0 ? 4 : 0);
                    const eye1Y = hy + eyeOffY - 4 + (eyeOffX !== 0 ? 4 : 0);
                    const eye2X = hx + eyeOffX + 4 + (eyeOffY !== 0 ? 4 : 0);
                    const eye2Y = hy + eyeOffY + 4 + (eyeOffX !== 0 ? 4 : 0);

                    [ [eye1X, eye1Y], [eye2X, eye2Y] ].forEach(([ex, ey]) => {
                        ctx.fillStyle = cs.eyeWhite;
                        ctx.beginPath();
                        ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = cs.eyePupil;
                        ctx.beginPath();
                        ctx.arc(ex + eyeOffX * 0.8, ey + eyeOffY * 0.8, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            }

            // Particles
            for (const p of particles) {
                ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('hsl', 'hsla');
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }

            // Paused indicator
            if (isPaused && isRunning) {
                ctx.fillStyle = cs.pauseBg;
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = cs.pauseText;
                ctx.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', w / 2, h / 2 - 6);
                ctx.font = '14px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = cs.pauseSubtext;
                ctx.fillText('按空格键继续', w / 2, h / 2 + 22);
                ctx.textAlign = 'start';
            }
        }

        // ─── Leaderboard UI ────────────────────────
        let currentLeaderboardFilter = 'all';
        let lastGameEntryId = null; // 追踪刚保存的记录，用于高亮

        function _formatDate(isoStr) {
            try {
                var d = new Date(isoStr);
                var mm = String(d.getMonth() + 1).padStart(2, '0');
                var dd = String(d.getDate()).padStart(2, '0');
                return mm + '-' + dd;
            } catch (e) { return '--'; }
        }

        function _modeIcon(mode) {
            return mode === 'timed' ? '⏱' : '🐍';
        }

        function _resultIcon(result) {
            switch (result) {
                case 'win': return '🎉';
                case 'timeUp': return '⏰';
                case 'bomb': return '💥';
                default: return '💀';
            }
        }

        function _rankDisplay(rank) {
            if (rank === 1) return '🥇';
            if (rank === 2) return '🥈';
            if (rank === 3) return '🥉';
            return rank;
        }

        function renderLeaderboardTable(filter) {
            filter = filter || currentLeaderboardFilter;
            currentLeaderboardFilter = filter;
            var entries = LeaderboardStore.getByMode(filter);
            var hasEntries = entries.length > 0;

            lbTbody.innerHTML = '';
            lbEmpty.classList.toggle('visible', !hasEntries);
            document.querySelector('.lb-table').style.display = hasEntries ? '' : 'none';

            for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                var tr = document.createElement('tr');
                if (e.id === lastGameEntryId) {
                    tr.classList.add('highlight');
                }
                tr.innerHTML =
                    '<td class="lb-col-rank">' + _rankDisplay(i + 1) + '</td>' +
                    '<td class="lb-col-name">' + _escapeHtml(e.playerName || '玩家') + '</td>' +
                    '<td class="lb-col-score">' + e.score + '</td>' +
                    '<td class="lb-col-date">' + _formatDate(e.date) + '</td>' +
                    '<td class="lb-col-mode">' + _modeIcon(e.mode) + '</td>' +
                    '<td class="lb-col-result">' + _resultIcon(e.result) + '</td>';
                lbTbody.appendChild(tr);
            }
        }

        function _escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function renderLeaderboardSummary() {
            var top5 = LeaderboardStore.getTop(5);
            if (top5.length === 0) {
                lbSummaryList.innerHTML = '<div class="lb-summary-empty">暂无记录</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < top5.length; i++) {
                var e = top5[i];
                html += '<div class="lb-summary-row">' +
                    '<span class="lb-summary-rank">' + _rankDisplay(i + 1) + '</span>' +
                    '<span class="lb-summary-name">' + _escapeHtml(e.playerName || '玩家') + '</span>' +
                    '<span class="lb-summary-score">' + e.score + ' 分</span>' +
                    '</div>';
            }
            lbSummaryList.innerHTML = html;
        }

        function openLeaderboard(highlightEntryId) {
            lastGameEntryId = highlightEntryId || null;
            // 重置筛选为全部
            currentLeaderboardFilter = 'all';
            var filterBtns = lbFilters.querySelectorAll('.lb-filter-btn');
            for (var i = 0; i < filterBtns.length; i++) {
                filterBtns[i].classList.toggle('active', filterBtns[i].dataset.filter === 'all');
            }
            renderLeaderboardTable('all');
            lbNameInput.value = playerName.get();
            // 暂时隐藏游戏结束覆盖层（如果可见），避免 z-order 冲突
            if (gameOverOverlay.classList.contains('active')) {
                gameOverOverlay.classList.add('lb-hidden');
            }
            leaderboardOverlay.classList.add('active');
        }

        function closeLeaderboard() {
            leaderboardOverlay.classList.remove('active');
            lastGameEntryId = null;
            // 恢复游戏结束覆盖层显示
            gameOverOverlay.classList.remove('lb-hidden');
        }

        function refreshPlayerNameUI() {
            var name = playerName.get();
            if (lbNameInput) lbNameInput.value = name;
            if (playerNameInput) playerNameInput.value = name;
        }

        // ─── Input Handling ─────────────────────────
        function changeDirection(dx, dy) {
            if (!isRunning || isPaused) return;
            // Prevent reversing into yourself
            if (dx === -direction.x && dy === -direction.y && snake.length > 1) return;
            nextDirection = { x: dx, y: dy };
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
        }

        function startGame() {
            // 利用用户手势初始化 AudioContext（符合浏览器自动播放策略）
            AudioManager.ensureContext();
            initGame();
            isRunning = true;
            isPaused = false;
            startOverlay.classList.remove('active');
            gameOverOverlay.classList.remove('active');
            startGameLoop();
        }

        function showStartOverlay() {
            // Show mode selection again (e.g., after game over)
            stopGameLoop();
            isRunning = false;
            gameOverOverlay.classList.remove('active');
            startOverlay.classList.add('active');
            initGame();
            draw();
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            // Mode switching before game starts
            if (!isRunning) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    const nextMode = gameMode === 'classic' ? 'timed' : 'classic';
                    selectMode(nextMode);
                    return;
                }
            }

            // Prevent scrolling with arrow keys
            const keyMap = {
                ArrowUp:    () => changeDirection(0, -1),
                ArrowDown:  () => changeDirection(0, 1),
                ArrowLeft:  () => changeDirection(-1, 0),
                ArrowRight: () => changeDirection(1, 0),
                w: () => changeDirection(0, -1),
                W: () => changeDirection(0, -1),
                s: () => changeDirection(0, 1),
                S: () => changeDirection(0, 1),
                a: () => changeDirection(-1, 0),
                A: () => changeDirection(-1, 0),
                d: () => changeDirection(1, 0),
                D: () => changeDirection(1, 0),
                ' ': () => {
                    e.preventDefault();
                    if (!isRunning) {
                        if (gameOverOverlay.classList.contains('active')) {
                            showStartOverlay();
                        } else {
                            startGame();
                        }
                        return;
                    }
                    togglePause();
                },
                t: () => cycleSkin(),
                T: () => cycleSkin(),
            };

            const action = keyMap[e.key];
            if (action) {
                e.preventDefault();
                action();
            }
        });

        // Buttons
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', showStartOverlay);

        // Mode card clicks
        modeCardClassic.addEventListener('click', () => selectMode('classic'));
        modeCardTimed.addEventListener('click', () => selectMode('timed'));

        // Mute button
        const muteBtn = document.getElementById('muteBtn');
        if (muteBtn) {
            muteBtn.addEventListener('click', () => {
                AudioManager.toggleMute();
            });
        }

        // Skin swatches
        document.querySelectorAll('.skin-swatch').forEach(btn => {
            btn.addEventListener('click', () => {
                const skinId = btn.dataset.skin;
                if (skinId) applySkin(skinId);
            });
        });

        // D-Pad for mobile
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const dir = btn.dataset.dir;
                const dirMap = {
                    up:    { x: 0, y: -1 },
                    down:  { x: 0, y: 1 },
                    left:  { x: -1, y: 0 },
                    right: { x: 1, y: 0 },
                };
                const d = dirMap[dir];
                if (d) changeDirection(d.x, d.y);
            });
        });

        // Touch swipe on canvas
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isRunning || isPaused) return;
            const dx = (e.changedTouches[0]?.clientX || 0) - touchStartX;
            const dy = (e.changedTouches[0]?.clientY || 0) - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            const threshold = 20;

            if (Math.max(absDx, absDy) < threshold) return;

            if (absDx > absDy) {
                changeDirection(dx > 0 ? 1 : -1, 0);
            } else {
                changeDirection(0, dy > 0 ? 1 : -1);
            }
        });

        // ─── Leaderboard Event Handlers ─────────────
        // 查看排行榜按钮（游戏结束覆盖层）
        viewLeaderboardBtn.addEventListener('click', function () {
            openLeaderboard(window._lastGameEntryId || null);
        });

        // 排行榜摘要链接（开始界面）
        lbSummaryLink.addEventListener('click', function (e) {
            e.stopPropagation();
            openLeaderboard(null);
        });

        // 关闭排行榜
        document.getElementById('lbCloseBtn').addEventListener('click', closeLeaderboard);

        // 点击覆盖层背景关闭
        leaderboardOverlay.addEventListener('click', function (e) {
            if (e.target === leaderboardOverlay) closeLeaderboard();
        });

        // 筛选按钮
        lbFilters.addEventListener('click', function (e) {
            var btn = e.target.closest('.lb-filter-btn');
            if (!btn) return;
            var filter = btn.dataset.filter;
            var allBtns = lbFilters.querySelectorAll('.lb-filter-btn');
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].classList.toggle('active', allBtns[i].dataset.filter === filter);
            }
            renderLeaderboardTable(filter);
        });

        // 排行榜面板中的昵称修改
        document.getElementById('lbNameSave').addEventListener('click', function () {
            var newName = lbNameInput.value;
            if (playerName.set(newName)) {
                refreshPlayerNameUI();
                renderLeaderboardTable();
                renderLeaderboardSummary();
            }
        });

        // 清空排行榜
        document.getElementById('lbClearBtn').addEventListener('click', function () {
            if (confirm('确定要清空所有排行榜记录吗？此操作不可恢复。')) {
                LeaderboardStore.clearAll();
                renderLeaderboardTable();
                renderLeaderboardSummary();
            }
        });

        // 开始界面的昵称修改
        document.getElementById('playerNameSave').addEventListener('click', function () {
            var newName = playerNameInput.value;
            if (playerName.set(newName)) {
                refreshPlayerNameUI();
                renderLeaderboardTable();
                renderLeaderboardSummary();
            }
        });

        // 键盘快捷键: Escape 关闭排行榜
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && leaderboardOverlay.classList.contains('active')) {
                e.preventDefault();
                closeLeaderboard();
            }
        });

        // ─── Draw initial state ────────────────────
        initGame();
        // 初始化排行榜 UI
        refreshPlayerNameUI();
        renderLeaderboardSummary();
        draw();
    })();
    </script>
</body>
</html>
