<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #22d3ee;
            --food: #f43f5e;
            --snake-head: #10b981;
            --snake-body-1: #34d399;
            --snake-body-2: #6ee7b7;
            --danger: #ef4444;
            --overlay: rgba(15, 23, 42, 0.85);
            /* ^^^ fallback values for initial paint; skin system injects them at runtime */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            /* ambient glow gradients are set dynamically by JS skin system */
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--snake-head), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-panel {
            display: flex;
            gap: 16px;
        }

        .score-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .score-value.current {
            color: var(--accent);
        }

        .score-value.best {
            color: #fbbf24;
        }

        /* ── Game Canvas ── */
        .canvas-wrapper {
            position: relative;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(51, 65, 85, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(34, 211, 238, 0.05);
        }

        canvas {
            display: block;
        }

        /* ── Overlay ── */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            gap: 16px;
            transition: opacity 0.3s ease;
            pointer-events: none;
            opacity: 0;
        }

        .overlay.active {
            pointer-events: auto;
            opacity: 1;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .overlay-title.game-over {
            color: var(--danger);
        }

        .overlay-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .overlay-subtitle .highlight {
            color: #fbbf24;
            font-weight: 700;
        }

        /* ── Buttons ── */
        .btn {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--snake-head), #059669);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #334155;
        }

        /* ── Controls Info ── */
        .controls-info {
            display: flex;
            gap: 24px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 7px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: inherit;
            color: var(--text);
            min-width: 24px;
        }

        .key-group {
            display: flex;
            gap: 3px;
        }

        /* ── Mobile D-Pad ── */
        .dpad {
            display: none;
            position: relative;
            width: 160px;
            height: 160px;
        }

        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: #334155;
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(0.92);
        }

        .dpad-up    { top: 0;   left: 55px; }
        .dpad-down  { bottom: 0; left: 55px; }
        .dpad-left  { top: 55px; left: 0;   }
        .dpad-right { top: 55px; right: 0;  }

        /* ── Skin Selector ── */
        .skin-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skin-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .skin-swatch {
            position: relative;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .skin-swatch::before {
            content: '';
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--snake-head);
        }

        .skin-swatch:hover {
            transform: scale(1.15);
            border-color: var(--text-secondary);
        }

        .skin-swatch:active {
            transform: scale(0.95);
        }

        .skin-swatch.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent);
        }

        /* ── Mute Button ── */
        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            outline: none;
            background: transparent;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .btn-icon:hover {
            transform: scale(1.15);
            border-color: var(--text-secondary);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        /* swatch tooltip */
        .skin-swatch::after {
            content: attr(data-name);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .skin-swatch:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Mode Selection Cards ── */
        .mode-cards {
            display: flex;
            gap: 14px;
            width: 100%;
            max-width: 380px;
        }

        .mode-card {
            flex: 1;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 16px 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
            outline: none;
            position: relative;
        }

        .mode-card:hover {
            border-color: var(--text-secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .mode-card:active {
            transform: translateY(0);
        }

        .mode-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent),
                        0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .mode-card-icon {
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        .mode-card-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }

        .mode-card-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .mode-card-best {
            font-size: 0.7rem;
            color: #fbbf24;
            font-weight: 600;
        }

        .mode-card-best span {
            font-variant-numeric: tabular-nums;
        }

        .mode-card .check-mark {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.85rem;
            color: var(--accent);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s ease;
        }

        .mode-card.selected .check-mark {
            opacity: 1;
            transform: scale(1);
        }

        /* ── Timer Card ── */
        .score-value.timer {
            color: var(--accent);
            transition: color 0.4s ease;
        }

        .score-value.timer.warning {
            color: #fbbf24;
        }

        .score-value.timer.danger {
            color: var(--danger);
            animation: timerPulse 0.6s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: 0.7; }
        }

        .score-card.timer-hidden {
            display: none;
        }

        /* ── Shield Indicator ── */
        .shield-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: 600;
            animation: shieldGlow 1.2s ease-in-out infinite;
        }

        .shield-indicator.active {
            display: flex;
        }

        @keyframes shieldGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Screen Flash ── */
        .canvas-wrapper.flash {
            animation: screenFlash 0.3s ease-out;
        }

        @keyframes screenFlash {
            0% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.6), 0 0 0 1px rgba(51, 65, 85, 0.5), 0 20px 60px rgba(0, 0, 0, 0.5); }
            100% { box-shadow: 0 0 0 20px rgba(192, 132, 252, 0), 0 0 0 1px rgba(51, 65, 85, 0.5), 0 20px 60px rgba(0, 0, 0, 0.5); }
        }

        /* ── Leaderboard Panel ── */
        #leaderboardOverlay {
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #leaderboardOverlay.active {
            /* overlay base handles opacity/pointer-events */
        }

        .overlay.lb-hidden {
            display: none;
        }

        .lb-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90vw;
            max-width: 520px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .lb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
        }

        .lb-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
        }

        .lb-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            line-height: 1;
        }

        .lb-close:hover {
            background: var(--border);
            color: var(--text);
        }

        .lb-filters {
            display: flex;
            gap: 6px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }

        .lb-filter-btn {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .lb-filter-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text);
        }

        .lb-filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .lb-table-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px;
            min-height: 120px;
            max-height: 340px;
        }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .lb-table thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .lb-table th {
            text-align: left;
            padding: 8px 6px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            background: var(--surface);
        }

        .lb-table td {
            padding: 8px 6px;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .lb-col-rank { width: 32px; text-align: center; }
        .lb-col-name {  }
        .lb-col-score { text-align: right; font-weight: 700; color: var(--accent); }
        .lb-col-date { text-align: center; color: var(--text-secondary); font-size: 0.75rem; }
        .lb-col-mode { text-align: center; font-size: 1rem; }
        .lb-col-result { text-align: center; font-size: 1rem; }

        .lb-table tbody tr {
            transition: background 0.2s ease;
        }

        .lb-table tbody tr:hover {
            background: color-mix(in srgb, var(--accent) 8%, transparent);
        }

        .lb-table tbody tr.highlight {
            background: color-mix(in srgb, var(--accent) 20%, transparent);
            animation: lbHighlightFade 2s ease-out;
        }

        @keyframes lbHighlightFade {
            0% { background: color-mix(in srgb, var(--accent) 40%, transparent); }
            100% { background: color-mix(in srgb, var(--accent) 20%, transparent); }
        }

        .lb-rank-medal {
            font-size: 1.1rem;
        }

        .lb-empty {
            display: none;
            text-align: center;
            padding: 32px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .lb-empty.visible {
            display: block;
        }

        .lb-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 16px;
            border-top: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .lb-name-edit {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lb-name-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .lb-name-input {
            width: 100px;
            padding: 5px 8px;
            font-size: 0.8rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .lb-name-input:focus {
            border-color: var(--accent);
        }

        .lb-name-save {
            padding: 5px 12px;
            font-size: 0.75rem;
        }

        .lb-clear-btn {
            font-size: 0.75rem;
            padding: 6px 14px;
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 40%, transparent);
        }

        .lb-clear-btn:hover {
            background: color-mix(in srgb, var(--danger) 15%, transparent);
            border-color: var(--danger);
        }

        /* ── Leaderboard Summary (Start Overlay) ── */
        .leaderboard-summary {
            width: 100%;
            max-width: 380px;
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .lb-summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .lb-summary-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        .lb-summary-link {
            font-size: 0.72rem;
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
            transition: opacity 0.2s ease;
        }

        .lb-summary-link:hover {
            opacity: 0.75;
        }

        .lb-summary-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .lb-summary-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            padding: 3px 4px;
            border-radius: 4px;
            color: var(--text);
        }

        .lb-summary-row:nth-child(odd) {
            background: color-mix(in srgb, var(--border) 30%, transparent);
        }

        .lb-summary-rank {
            width: 22px;
            font-weight: 700;
            text-align: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .lb-summary-name {
            flex: 1;
            margin: 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-summary-score {
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        .lb-summary-empty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 0;
        }

        /* ── Player Name Row (Start Overlay) ── */
        .player-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-name-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .player-name-input {
            width: 110px;
            padding: 6px 10px;
            font-size: 0.82rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .player-name-input:focus {
            border-color: var(--accent);
        }

        .player-name-save {
            padding: 6px 14px;
            font-size: 0.75rem;
        }

        /* ── Game Over Buttons ── */
        .gameover-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .title { font-size: 1.5rem; }
            .score-card { min-width: 60px; padding: 8px 12px; }
            .score-value { font-size: 1.1rem; }
            .dpad { display: block; }
            .controls-info { display: none; }
            .canvas-wrapper { border-radius: 12px; }
            .skin-swatch { width: 44px; height: 44px; }
            .skin-swatch::before { width: 24px; height: 24px; }
            .btn-icon { width: 44px; height: 44px; font-size: 1.3rem; }
        }

        @media (min-width: 601px) {
            .dpad { display: none; }
        }

        @media (hover: none) and (pointer: coarse) {
            .dpad { display: block; }
            .controls-info { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🐍 贪吃蛇</h1>
            <div class="score-panel">
                <div class="score-card timer-hidden" id="timerCard">
                    <div class="score-label">剩余时间</div>
                    <div class="score-value timer" id="timerValue">60s</div>
                </div>
                <div class="score-card">
                    <div class="score-label">得分</div>
                    <div class="score-value current" id="currentScore">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">最高分</div>
                    <div class="score-value best" id="bestScore">0</div>
                </div>
                <div class="shield-indicator" id="shieldIndicator">🛡️ 护盾</div>
            </div>
        </div>

        <!-- Game Canvas -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>

            <!-- Start Overlay -->
            <div class="overlay active" id="startOverlay">
                <div class="overlay-title">🐍 贪吃蛇</div>
                <div class="mode-cards" id="modeCards">

    <script>
    (function () {
        // ─── Audio Manager ──────────────────────────
        const AudioManager = (function () {
            let audioCtx = null;
            let _muted = false;

            // 检测 Web Audio API 可用性
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                // 浏览器不支持 Web Audio API，所有方法静默降级为 no-op
                return {
                    ensureContext: function () {},
                    playExplosion: function () {},
                    toggleMute: function () {},
                    get muted() { return true; },
                };
            }

            function ensureContext() {
                if (!audioCtx) {
                    try {
                        audioCtx = new AudioContextClass();
                    } catch (e) {
                        // AudioContext 创建失败，静默降级
                        return;
                    }
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(function () {
                        // resume 失败不影响游戏运行
                    });
                }
            }

            /**
             * 合成并播放爆炸音效
             * @param {number} chainLevel - 连锁引爆级别（1 = 单颗爆炸）
             */
            function playExplosion(chainLevel) {
                if (_muted || !audioCtx || audioCtx.state !== 'running') return;

                const now = audioCtx.currentTime;
                const cl = Math.min(chainLevel || 1, 6); // 限制上限避免破音

                // ── 噪声通道：提供"碎裂/嘶嘶"质感 ──
                const bufferSize = Math.floor(audioCtx.sampleRate * 0.5);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = Math.min(200 + cl * 80, 800);
                noiseFilter.Q.value = 0.5;

                const noiseGain = audioCtx.createGain();
                const noiseVol = Math.min(0.8 + cl * 0.05, 1.0);
                noiseGain.gain.setValueAtTime(noiseVol, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5 + cl * 0.1);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.6 + cl * 0.1);

                // ── 低频振荡器通道：提供"轰"的重低音 ──
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);

                const oscGain = audioCtx.createGain();
                const oscVol = Math.min(0.6 + cl * 0.05, 0.8);
                oscGain.gain.setValueAtTime(oscVol, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(oscGain);
                oscGain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            function toggleMute() {
                _muted = !_muted;
                // 更新 DOM 按钮图标
                const btn = document.getElementById('muteBtn');
                if (btn) {
                    btn.textContent = _muted ? '🔇' : '🔊';
                }
            }

            return {
                ensureContext: ensureContext,
                playExplosion: playExplosion,
                toggleMute: toggleMute,
                get muted() { return _muted; },
            };
        })();

        // ─── Constants ──────────────────────────────

        // ─── Leaderboard Store ───────────────────
        function getPlayerName() {
            try {
                var n = localStorage.getItem('snake-player-name');
                return (n && n.trim()) ? n.trim() : '玩家';
            } catch (e) { return '玩家'; }
        }

        function setPlayerName(newName) {
            var trimmed = (newName || '').trim();
            if (!trimmed) return false;
            try { localStorage.setItem('snake-player-name', trimmed); } catch (e) { return false; }
            return true;
        }

        const LeaderboardStore = (function () {
            const STORAGE_KEY = 'snake-leaderboard';
            const MAX_ENTRIES = 20;

            function _safeRead() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    const data = JSON.parse(raw);
                    if (!Array.isArray(data)) return [];
                    return data;
                } catch (e) { return []; }
            }

            function _safeWrite(entries) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
                } catch (e) { /* 静默降级 */ }
            }

            /** 按分数降序、同分按日期降序排序 */
            function _sort(entries) {
                return entries.sort(function (a, b) {
                    if (b.score !== a.score) return b.score - a.score;
                    return (b.date || '').localeCompare(a.date || '');
                });
            }

            /** 插入新记录，返回排名（1-based），不入榜返回 -1 */
            function addEntry(entry) {
                if (!entry || !entry.score || entry.score <= 0) return -1;
                var entries = _safeRead();
                var record = {
                    id: Date.now(),
                    score: entry.score,
                    date: new Date().toISOString(),
                    mode: entry.mode || 'classic',
                    playerName: getPlayerName(),
                    snakeLength: entry.snakeLength || 0,
                    result: entry.result || 'death',
                    skin: entry.skin || 'classic',
                };
                entries.push(record);
                entries = _sort(entries);
                // 找排名
                var rank = -1;
                for (var i = 0; i < entries.length; i++) {
                    if (entries[i].id === record.id) { rank = i + 1; break; }
                }
                // 淘汰超出部分
                if (entries.length > MAX_ENTRIES) {
                    entries = entries.slice(0, MAX_ENTRIES);
                    // 如果新记录被淘汰了
                    if (rank > MAX_ENTRIES) rank = -1;
                }
                _safeWrite(entries);
                return rank;
            }

            function getAll() {
                return _safeRead();
            }

            function getTop(n) {
                return _safeRead().slice(0, n);
            }

            function getByMode(mode) {
                if (mode === 'all') return getAll();
                return _safeRead().filter(function (e) { return e.mode === mode; });
            }

            function clearAll() {
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            }

            function updateAllNames(newName) {
                var entries = _safeRead();
                for (var i = 0; i < entries.length; i++) {
                    entries[i].playerName = newName;
                }
                _safeWrite(entries);
            }

            /** 迁移旧版最高分数据 */
            function migrateOldScores() {
                var entries = _safeRead();
                if (entries.length > 0) return; // 已有数据，跳过
                var migrated = false;
                try {
                    var classic = localStorage.getItem('snake-best-score-classic');
                    if (classic) {
                        var cScore = parseInt(classic, 10) || 0;
                        if (cScore > 0) {
                            entries.push({
                                id: Date.now() - 1,
                                score: cScore,
                                date: new Date().toISOString(),
                                mode: 'classic',
                                playerName: getPlayerName(),
                                snakeLength: 0,
                                result: 'death',
                                skin: 'classic',
                            });
                            migrated = true;
                        }
                        localStorage.removeItem('snake-best-score-classic');
                    }
                    var timed = localStorage.getItem('snake-best-score-timed');
                    if (timed) {
                        var tScore = parseInt(timed, 10) || 0;
                        if (tScore > 0) {
                            entries.push({
                                id: Date.now(),
                                score: tScore,
                                date: new Date().toISOString(),
                                mode: 'timed',
                                playerName: getPlayerName(),
                                snakeLength: 0,
                                result: 'timeUp',
                                skin: 'classic',
                            });
                            migrated = true;
                        }
                        localStorage.removeItem('snake-best-score-timed');
                    }
                    if (migrated) {
                        entries = _sort(entries);
                        _safeWrite(entries);
                    }
                } catch (e) { /* 静默降级 */ }
            }

            return {
                addEntry: addEntry,
                getAll: getAll,
                getTop: getTop,
                getByMode: getByMode,
                clearAll: clearAll,
                updateAllNames: updateAllNames,
                migrateOldScores: migrateOldScores,
            };
        })();

        // ─── Player Name Manager ─────────────────
        var playerName = (function () {
            function get() { return getPlayerName(); }
            function set(newName) {
                if (!setPlayerName(newName)) return false;
                LeaderboardStore.updateAllNames(getPlayerName());
                return true;

            return { get: get, set: set };

        let currentSkin = null;

        // ─── DOM Elements ──────────────────────────
        const canvas = document.getElementById('gameCanvas');
