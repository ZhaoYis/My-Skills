# OpenSpec configuration for fullstack-todo
schema: custom
stacks:
  - backend
  - frontend

context: |
  Fullstack Todo application with Express backend API and React frontend.
  Backend: Express + TypeScript, REST API on /api/todos
  Frontend: React + Vite + TypeScript, SPA consuming backend API

rules:
  verify: npm run verify
  test: npm test --workspaces --if-present
  build: |
    cd backend && npm install && npm run build
    cd ../frontend && npm install && npm run build
