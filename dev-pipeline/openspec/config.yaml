schema: spec-driven

# ── 项目上下文 ──
# 每次生成 OpenSpec 产物时，AI 都会加载此上下文。
context: |
  ## 项目身份
  - **名称**: opsx-dev-pipeline
  - **定位**: 一键式 AI 开发流水线脚手架 CLI。根据用户选择的 AI 工具（Claude Code / Cursor / Codex / Generic），在目标项目中生成对应的 skills、commands、rules、prompts。
  - **仓库**: `git@github.com:ZhaoYis/My-Skills.git`，子目录 `dev-pipeline/`（monorepo 内的独立 npm 包）。

  ## 技术栈
  - **语言**: TypeScript 5.8+，strict 模式，ES2022 target。
  - **模块系统**: ESM only (`"type": "module"`)，NodeNext 模块解析。**相对 import 必须带 `.js` 扩展名**（即使源文件是 `.ts`）。
  - **运行时**: Node.js ≥ 20。
  - **包管理**: npm（`package-lock.json` 已提交）。
  - **CLI 框架**: `cac` — 命令/选项解析。
  - **交互提示**: `prompts`（`--yes` 下跳过）。
  - **模板引擎**: `handlebars`（`.hbs` 模板位于 `templates/`）。
  - **文件操作**: `fs-extra`。
  - **校验**: `zod` v4。
  - **终端颜色**: `picocolors`。
  - **测试框架**: `vitest`。
  - **代码格式化/静态检查**: Biome（`biome.json`）。
  - **构建**: `tsc -p tsconfig.build.json` → `dist/`。

  ## 代码约定
  - 严格 TypeScript：禁止隐式 `any`，显式处理 `undefined`/`null`。
  - 优先使用显式 `interface`/`type` 定义；每个 core 子模块导出 `types.ts`。
  - CLI 错误向上冒泡到 bin 入口，打印红色（`picocolors`）并 exit code 1。中间层抛 `Error`，不直接 `process.exit`。
  - 用户可见输出统一使用 `picocolors`。
  - 一致遵循 `--dry-run`、`--yes`、`--force` 标志；默认非破坏性。
  - 测试文件：kebab-case `*.test.ts`，与被测模块同名。
  - 格式化：Biome（单引号、分号、尾逗号、2 空格缩进）。

  ## 架构关键点
  - **项目根 ≠ 仓库根**：`dev-pipeline/` 是 `My-Skills` monorepo 的子目录。`resolvePackageRoot()` 通过查找 `package.json` + `config/tools.json` + `templates/common/base/README.md.hbs` 来定位包根。
  - **`test-pipeline/` 是独立包**：通过 `"opsx-dev-pipeline": "file:.."` 依赖父包，有自己的 `package.json` 和 `node_modules/`。主 vitest 配置排除该目录。
  - **OpenSpec 前置条件**：使用 `opsx-dev-pipeline` 前必须先安装 `openspec` CLI。
  - **清单追踪**：工具在目标项目中写入 `opsx-dev-pipeline.json` manifest，记录所有托管文件。`sync`、`upgrade`、`uninstall`、`doctor` 均依赖此 manifest。
  - **模板系统**：`templates/common/` 存放共享模板，`templates/tools/<tool>/overlay/` 存放各工具差异化覆盖。渲染时合并。
  - **知识优先规则**：所有工具 overlay 注入"任务开始前先检索 `.knowledge/`"规则；知识库不存在时静默跳过，不报错。

  ## 领域概念
  - **Tool Adapter**: AI 工具适配器（claude/cursor/codex/generic），定义在 `config/tools.json`。
  - **Feature Flag**: 可选能力开关（prototype/structural-analysis-hint/opsx-pr/opsx-ci-triage），定义在 `config/features.json`。
  - **Pipeline Phase**: 0–7 阶段流水线（入口 → 提案 → 应用 → 审查 → 单测 → 归档 → 推送/合并 → PR/CI）。
  - **Knowledge Skeleton**: `.knowledge/` 知识库骨架，`init` 时生成，`opsx-learn` 渐进填充。
  - **Doctor**: 知识库健康巡检，0–100 评分，支持 `--history` 趋势对比和 `--stale-days` 老化阈值。

  ## 命令速查
  ```bash
  npm run build          # tsc 编译到 dist/
  npm run typecheck      # 类型检查（不产出）
  npm test               # vitest run（全量）
  npm run test:watch     # vitest watch
  npm run dev            # tsx 运行 CLI 源码
  npm run format         # biome format --write .
  npm run lint           # biome check .
  npm run lint:fix       # biome check --write .
  npm run pack:check     # npm pack --dry-run
  npm run init:smoke     # 冒烟：init --tool claude --yes --dry-run
  ```

# ── 产物规则 ──
# 每种 OpenSpec 产物的自定义约束。
rules:
  proposal:
    - 提案必须用中文撰写。
    - 提案必须包含"变更动机"、"影响范围"、"风险评估"和"验证计划"四个章节。
    - 如果涉及 CLI 命令变更，必须列出受影响的命令和标志变化。
    - 如果涉及模板（templates/）变更，必须说明对现有已安装项目的影响和升级路径。
    - 提案中引用的文件路径必须使用相对于 `dev-pipeline/` 的路径。
    - 提案不超过 800 字（不含代码块）。

  specs:
    - 规范文件必须用中文撰写。
    - 每个规范文件对应一个核心模块（`src/core/<module>/`），命名与模块目录一致。
    - 规范必须包含：模块职责、公开接口（函数签名 + 类型）、依赖关系、错误处理策略、测试要点。
    - 接口签名必须使用 TypeScript 语法，与源码保持一致。
    - 涉及 manifest 或模板的变更，必须注明向后兼容性要求。

  tasks:
    - 任务清单必须用中文撰写。
    - 每个任务拆分为 2 小时以内的可完成单元。
    - 任务依赖关系必须显式标注（`depends_on` 字段）。
    - 涉及 `src/core/` 变更的任务，必须包含对应的单测任务（`test/unit/`）。
    - 涉及 CLI 命令变更的任务，必须包含对应的集成测试任务（`test/integration/`）。
    - 模板变更任务必须包含 `npm run init:smoke` 验证步骤。

  design:
    - 设计文档必须用中文撰写。
    - 设计文档必须包含：背景与动机、方案对比（至少 2 个备选方案）、详细设计、影响面分析、验证断言。
    - 验证断言字段（`verification_assertions`）必须结构化，供 `opsx-verify` 直接消费。
    - 接口变更必须附 TypeScript 类型定义。
    - 涉及 CLI 用户接口的变更，必须附命令示例。

  documentation:
    - README.md 变更必须同步更新 `docs/` 目录下的相关文档。
    - 新增命令或功能必须更新 README 中的命令表格。
    - 新增 feature flag 必须更新 README 中的可选能力说明。
    - 文档用中文撰写，命令示例和代码块保持原样。