name: Metrics Server Databases

on:
  pull_request:
    paths:
      - 'package.json'
      - 'metrics-server/**'
      - 'metrics-website/**'
      - '.github/workflows/metrics-server-databases.yml'
  push:
    branches: [main, master, develop, feature/lite]
    paths:
      - 'package.json'
      - 'metrics-server/**'
      - 'metrics-website/**'
      - '.github/workflows/metrics-server-databases.yml'

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsx_metrics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opsx_metrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsx_metrics
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsx_metrics
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            metrics-server/package-lock.json
            metrics-website/package-lock.json
      - run: npm ci --prefix metrics-server
      - run: npm ci --prefix metrics-website
      - run: npm --prefix metrics-website exec -- playwright install --with-deps chromium
      - run: npm run metrics:acceptance

  mysql:
    runs-on: ubuntu-latest
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: opsx_metrics
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NODE_ENV: test
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://root:mysql@localhost:3306/opsx_metrics
      TEST_DATABASE_URL: mysql://root:mysql@localhost:3306/opsx_metrics
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            metrics-server/package-lock.json
            metrics-website/package-lock.json
      - run: npm ci --prefix metrics-server
      - run: npm ci --prefix metrics-website
      - run: npm --prefix metrics-website exec -- playwright install --with-deps chromium
      - run: npm run metrics:acceptance
