name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['16', '18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSpec CLI (Node >=20 only)
        if: matrix.node-version != '16' && matrix.node-version != '18'
        run: |
          npm install -g @fission-ai/openspec@latest
          openspec --version

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests (all)
        if: matrix.node-version != '16' && matrix.node-version != '18'
        run: npm test

      - name: Run tests (Node 16/18 — skip openspec-dependent)
        if: matrix.node-version == '16' || matrix.node-version == '18'
        run: npm test -- --exclude 'test/unit/run-init.test.ts'