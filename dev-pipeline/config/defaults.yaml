# Dev-Pipeline 默认配置
# 项目可通过 openspec/config.yaml 覆盖，或通过 openspec/overrides.yaml 本地覆写

pipeline:
  language: zh
  default_route: standard

  review:
    max_rounds: 3
    auto_fix: false

  tests:
    required: true
    command_auto_detect: true

  git:
    commit_style: conventional
    branch_prefix: feature/

  # Route 到 Phase 的唯一配置来源
  routes:
    trivial:
      description: "无行为变化的极小变更"
      phases: [0, 2, 6]
      examples:
        - typo
        - formatting
        - comment-only
        - import-cleanup
      conditions:
        - "不改变运行时行为"
        - "不改变 API 或配置语义"
        - "不影响多个模块"

    standard:
      description: "标准变更"
      phases: [0, 1, 2, 3, 6]
      examples:
        - 功能开发
        - Bug 修复
        - 重构

    full:
      description: "高保障变更"
      phases: [0, 1, 2, 3, 4, 5, 6, 7]
      examples:
        - 核心业务逻辑变更
        - 数据库迁移
        - 安全相关变更

knowledge:
  two_phase_loading: true
  asset_kind_rank:
    - constraint
    - procedure
    - principle
    - convention
